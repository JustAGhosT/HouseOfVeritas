#cloud-config
package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/sbin/hov-install-migration-tools
    owner: root:root
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      export DEBIAN_FRONTEND=noninteractive

      install -d -m 0755 /etc/apt/keyrings /usr/share/postgresql-common/pgdg
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl gnupg jq xz-utils

      curl --fail --silent --show-error --location \
        https://packages.microsoft.com/keys/microsoft.asc \
        | gpg --dearmor --yes --output /etc/apt/keyrings/microsoft.gpg
      chmod 0644 /etc/apt/keyrings/microsoft.gpg

      cat >/etc/apt/sources.list.d/microsoft-prod.sources <<'EOF'
      Types: deb
      URIs: https://packages.microsoft.com/ubuntu/24.04/prod
      Suites: noble
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/microsoft.gpg
      EOF

      cat >/etc/apt/sources.list.d/azure-cli.sources <<'EOF'
      Types: deb
      URIs: https://packages.microsoft.com/repos/azure-cli/
      Suites: noble
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/microsoft.gpg
      EOF

      curl --fail --silent --show-error --location \
        https://www.postgresql.org/media/keys/ACCC4CF8.asc \
        --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
      chmod 0644 /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
      cat >/etc/apt/sources.list.d/pgdg.sources <<'EOF'
      Types: deb
      URIs: https://apt.postgresql.org/pub/repos/apt
      Suites: noble-pgdg
      Components: main
      Architectures: amd64
      Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
      EOF

      curl --fail --silent --show-error --location \
        https://www.mongodb.org/static/pgp/server-8.0.asc \
        | gpg --dearmor --yes --output /etc/apt/keyrings/mongodb-server-8.0.gpg
      chmod 0644 /etc/apt/keyrings/mongodb-server-8.0.gpg
      cat >/etc/apt/sources.list.d/mongodb-org-8.0.sources <<'EOF'
      Types: deb
      URIs: https://repo.mongodb.org/apt/ubuntu
      Suites: noble/mongodb-org/8.0
      Components: multiverse
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/mongodb-server-8.0.gpg
      EOF

      apt-get update
      apt-get install -y --no-install-recommends \
        powershell=7.6.5-1.deb \
        azure-cli=2.89.1-1~noble \
        azcopy=10.32.6 \
        postgresql-client-16=16.15-1.pgdg24.04+2 \
        mongodb-database-tools \
        mongodb-mongosh

      node_version='22.23.2'
      node_archive="node-v${node_version}-linux-x64.tar.xz"
      node_sha256='d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307'
      node_tmp="/tmp/${node_archive}"
      curl --fail --silent --show-error --location \
        "https://nodejs.org/dist/v${node_version}/${node_archive}" \
        --output "$node_tmp"
      printf '%s  %s\n' "$node_sha256" "$node_tmp" | sha256sum --check --strict
      tar --extract --xz --file "$node_tmp" --directory /usr/local --strip-components=1
      rm -f "$node_tmp"

      apt-mark hold powershell azure-cli azcopy postgresql-client-16 mongodb-database-tools mongodb-mongosh

  - path: /usr/local/sbin/hov-verify-migration-tools
    owner: root:root
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      test ! -e /var/run/reboot-required
      test "$(pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()')" = '7.6.5'
      test "$(az version --output json | jq --raw-output '."azure-cli"')" = '2.89.1'
      psql_version="$(psql --version)"
      case "$psql_version" in
        *' 16.15 '*) ;;
        *' 16.15'*) ;;
        *) echo "Expected PostgreSQL client 16.15, got: $psql_version" >&2; exit 1 ;;
      esac
      case "$(node --version)" in
        v22.23.2) ;;
        *) echo 'Expected Node.js v22.23.2.' >&2; exit 1 ;;
      esac
      case "$(azcopy --version)" in
        *'10.32.6'*) ;;
        *) echo 'Expected AzCopy 10.32.6.' >&2; exit 1 ;;
      esac
      mongodump --version >/dev/null
      mongorestore --version >/dev/null
      mongosh --version >/dev/null

      install -d -m 0750 /var/lib/hov-migration
      jq --null-input \
        --arg boot_id "$(cat /proc/sys/kernel/random/boot_id)" \
        --arg verified_at "$(date --utc --iso-8601=seconds)" \
        --arg pwsh "$(pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()')" \
        --arg azure_cli "$(az version --output json | jq --raw-output '."azure-cli"')" \
        --arg psql "$psql_version" \
        --arg node "$(node --version)" \
        --arg azcopy "$(azcopy --version | head -n 1)" \
        --arg mongodump "$(mongodump --version | head -n 1)" \
        --arg mongosh "$(mongosh --version)" \
        '{status:"ready",reboot_required:false,boot_id:$boot_id,verified_at:$verified_at,versions:{pwsh:$pwsh,azure_cli:$azure_cli,psql:$psql,node:$node,azcopy:$azcopy,mongodump:$mongodump,mongosh:$mongosh}}' \
        >/var/lib/hov-migration/tooling-ready.json.tmp
      chmod 0640 /var/lib/hov-migration/tooling-ready.json.tmp
      mv /var/lib/hov-migration/tooling-ready.json.tmp /var/lib/hov-migration/tooling-ready.json

runcmd:
  - [bash, -lc, /usr/local/sbin/hov-install-migration-tools]
  - [bash, -lc, /usr/local/sbin/hov-verify-migration-tools]

final_message: "HOV migration runner cloud-init completed after $UPTIME seconds."

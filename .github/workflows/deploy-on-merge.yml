name: "Deploy on Merge"

# Auto-deploy after PR merge to main. Infra deploys only when terraform changes
# (terraform-apply.yml). Functions deploy only when function code changes
# (deploy-functions.yml). This workflow deploys the web app when app code changes.
on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "hooks/**"
      - "public/**"
      - "styles/**"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - "tsconfig.json"
      - "tailwind.config*"
      - "postcss.config*"
      - "instrumentation.ts"
      - ".github/workflows/deploy-on-merge.yml"

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: "nl-prod-hov-rg"
  AZURE_ENV: "prod"

jobs:
  quality-checks:
    name: "Quality Checks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/house_of_veritas_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

  build:
    name: "Build Application"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/house_of_veritas_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm build

      - name: Prepare Standalone for Deployment
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          jq '.scripts = ((.scripts // {}) + {"start": "node server.js"})' .next/standalone/package.json > .next/standalone/package.json.tmp && mv .next/standalone/package.json.tmp .next/standalone/package.json

      - name: Remove Files with Invalid Characters
        run: find .next/standalone -type f -name '*:*' -print -delete

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: .next/standalone
          include-hidden-files: true
          retention-days: 7

  deploy-webapp:
    name: "Deploy Web App"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-checks, build]
    environment: production

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: nextjs-build

      - name: Verify artifact contains .next
        run: |
          test -d .next && test -f .next/BUILD_ID || (echo "ERROR: .next or BUILD_ID missing from artifact"; exit 1)
          echo "Artifact verified: .next/BUILD_ID present"

      - name: Create deployment package
        run: zip -r deploy.zip . -x "*.git*"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME || 'nl-prod-hov-app' }}
          package: deploy.zip

      - name: Verify Web App Health
        run: |
          HEALTH_URL="https://${{ vars.WEBAPP_NAME || 'nl-prod-hov-app' }}.azurewebsites.net/api/health"
          healthy=false
          for i in {1..10}; do
            RESPONSE=$(curl -fsS "$HEALTH_URL" || true)
            if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
              echo "Web App health endpoint is healthy"
              healthy=true
              break
            fi
            echo "Waiting for Web App health endpoint... (attempt $i/10)"
            sleep 15
          done
          if [ "$healthy" != "true" ]; then
            echo "Web App health endpoint failed after 10 attempts"
            exit 1
          fi

name: "Deploy on Merge"

# Auto-deploy after PR merge to main. Infra deploys only when terraform changes
# (terraform-apply.yml). Functions deploy only when function code changes
# (deploy-functions.yml). This workflow deploys the web app when app code changes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "hooks/**"
      - "public/**"
      - "styles/**"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - "tsconfig.json"
      - "tailwind.config*"
      - "postcss.config*"
      - "instrumentation.ts"
      - "scripts/verify-deployment-build.mjs"
      - ".github/workflows/deploy-on-merge.yml"

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: "nex-prod-hov-rg"
  AZURE_ENV: "prod"

jobs:
  quality-checks:
    name: "Quality Checks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/house_of_veritas_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

  build:
    name: "Build Application"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/house_of_veritas_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        env:
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Prepare Standalone for Deployment
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/scripts
          cp scripts/verify-deployment-build.mjs .next/standalone/scripts/
          jq '.scripts = ((.scripts // {}) + {"start": "node server.js"})' .next/standalone/package.json > .next/standalone/package.json.tmp && mv .next/standalone/package.json.tmp .next/standalone/package.json

      - name: Remove Files with Invalid Characters
        run: find .next/standalone -type f -name '*:*' -print -delete

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: .next/standalone
          include-hidden-files: true
          retention-days: 7

  deploy-webapp:
    name: "Deploy Web App"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-checks, build]
    environment: production
    # Shared with the manual deployment workflow so only one web app mutation
    # can run at a time. Running deployments are never cancelled.
    concurrency:
      group: hov-production-webapp
      cancel-in-progress: false
      queue: max

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: nextjs-build

      - name: Verify artifact contains .next
        run: |
          test -d .next && test -f .next/BUILD_ID || (echo "ERROR: .next or BUILD_ID missing from artifact"; exit 1)
          echo "Artifact verified: .next/BUILD_ID present"

      - name: Create deployment package
        run: zip -r deploy.zip . -x "*.git*"

      # AZURE_CREDENTIALS (client-secret login) authenticates into a subscription
      # that doesn't contain nex-prod-hov-rg -- confirmed by run 33862780562,
      # where login succeeded but the deploy step then failed with "Resource
      # nex-prod-hov-app of type Microsoft.Web/Sites doesn't exist."
      #
      # This job's `environment: production` means its OIDC subject is
      # repo:.../house-of-veritas:environment:production (GitHub always includes
      # the environment name in the subject for an environment-bound job). The
      # `production` GitHub environment has its own AZURE_CLIENT_ID variable
      # override pointing at house-of-veritas-github-oidc (Contributor + User
      # Access Administrator on nex-prod-hov-rg), which has a federated
      # credential for exactly that subject -- added alongside this change. Do
      # not "simplify" this to the repo-level AZURE_CLIENT_ID: that app
      # (house-of-veritas-checklist-oidc-v2) is Reader-only and is federated
      # only for `pull_request`/`ref:refs/heads/main`, not this environment.
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME || 'nex-prod-hov-app' }}
          package: deploy.zip

      - name: Verify Exact Web App Deployment
        run: |
          HEALTH_URL="https://${{ vars.WEBAPP_NAME || 'nex-prod-hov-app' }}.azurewebsites.net/api/health"
          node scripts/verify-deployment-build.mjs \
            --url "$HEALTH_URL" \
            --expected "${{ github.sha }}"

  post-deploy-api-probes:
    name: "Optional Post-Deployment API Probes"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-webapp]
    if: always() && needs.deploy-webapp.result == 'success'
    continue-on-error: true
    outputs:
      probe_outcome: ${{ steps.run-probes.outputs.probe_outcome || 'unknown' }}
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run advisory API probes
        id: run-probes
        continue-on-error: true
        env:
          BASE_URL: "https://${{ vars.WEBAPP_NAME || 'nex-prod-hov-app' }}.azurewebsites.net"
          POST_DEPLOY_PROBE: "true"
          POST_DEPLOY_ADMIN_SESSION: ${{ secrets.POST_DEPLOY_ADMIN_SESSION }}
          POST_DEPLOY_ADMIN_SESSION_COOKIE_NAME: ${{ vars.POST_DEPLOY_ADMIN_SESSION_COOKIE_NAME || '__Secure-authjs.session-token' }}
        run: |
          if [ -z "$POST_DEPLOY_ADMIN_SESSION" ]; then
            echo "probe_outcome=skipped" >> "$GITHUB_OUTPUT"
            echo "## Optional post-deployment API probes" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped: configure a short-lived POST_DEPLOY_ADMIN_SESSION environment secret to enable authenticated probes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          pnpm run test:e2e -- tests/e2e/05-post-deploy-api-probes.spec.ts
          probe_exit_code=$?
          set -e

          if [ "$probe_exit_code" -eq 0 ]; then
            echo "probe_outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "probe_outcome=failed" >> "$GITHUB_OUTPUT"
          fi

          exit "$probe_exit_code"

      - name: Publish advisory API probe result
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.run-probes.outputs.probe_outcome || 'unknown' }}
        run: |
          echo "## Optional post-deployment API probes" >> "$GITHUB_STEP_SUMMARY"
          case "$PROBE_OUTCOME" in
            success) echo "Passed: authenticated API probes completed." >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "Skipped: POST_DEPLOY_ADMIN_SESSION is not configured." >> "$GITHUB_STEP_SUMMARY" ;;
            failed) echo "Warning: authenticated API probes failed. Review this job before the next deployment." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "Warning: probe outcome was not recorded. Review this job." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
